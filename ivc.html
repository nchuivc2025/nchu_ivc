<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracing the Light | 興大國際志工年度成果展</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=GFS+Didot&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-gold: #D4AF37;
            --color-dark: #0A0A0A;
            --color-ivc-green: #326755;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background-color: var(--color-dark);
            color: #E5E5E5;
            font-family: 'Noto Serif TC', serif;
        }
        .font-cinzel { font-family: 'Cinzel', serif; font-weight: 400; }
        .font-didot  { font-family: 'GFS Didot', serif; }
        .gold-text   { color: var(--color-gold); }
        .gold-bg     { background-color: var(--color-gold); }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10,10,10,0.25) 0%, rgba(10,10,10,0.85) 60%, rgba(10,10,10,1) 100%);
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
        }

        /* 倒數數字 */
        .countdown-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 64px;
        }
        .countdown-num {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 400;
            color: #D4AF37;
            line-height: 1;
        }
        .countdown-label {
            font-family: 'GFS Didot', serif;
            font-size: 9px;
            letter-spacing: 0.25em;
            color: rgba(255,255,255,0.4);
            margin-top: 6px;
            text-transform: uppercase;
        }
        .countdown-sep {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #D4AF37;
            opacity: 0.4;
            margin: 0 8px;
            padding-bottom: 18px;
        }

        .shadow-text { text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
    <section class="hero">
        <img class="hero-img" src="https://lh3.googleusercontent.com/d/1f6kVP_ypNOeiVg4T4lNEYW6VCl2oVXmB" alt="背景大圖">
        <div class="hero-overlay"></div>
        <div class="hero-content text-center px-6 w-full max-w-3xl mx-auto">

            <!-- 小標 -->
            <p class="text-xs tracking-[0.4em] mb-8 opacity-60 uppercase font-didot">
                2026 Annual International Volunteers Club Exhibition
            </p>

            <!-- 主標題 -->
            <h1 class="font-cinzel text-4xl sm:text-6xl lg:text-7xl mb-6 tracking-tight shadow-text whitespace-nowrap">
                Tracing the Light
            </h1>

            <!-- 副標 -->
            <h2 class="text-base sm:text-lg gold-text tracking-[0.3em] mb-10 italic font-didot">
                A Journey from Mud to Stars
            </h2>

            <!-- 金線 -->
            <div class="h-px w-24 gold-bg mx-auto mb-10 opacity-50"></div>

            <!-- 開展資訊 -->
            <p class="text-xs tracking-[0.3em] opacity-50 uppercase mb-2 font-didot">Opening on</p>
            <p class="text-sm sm:text-base tracking-[0.2em] mb-12 leading-loose">
                05 / 11 &nbsp;MON. &nbsp;2026<br>
                <span class="text-xs opacity-50">國立中興大學 雲平樓 1F</span>
            </p>

            <!-- 倒數計時 -->
            <div class="flex items-end justify-center mb-14" id="countdown">
                <div class="countdown-box">
                    <span class="countdown-num" id="cd-days">--</span>
                    <span class="countdown-label">Days</span>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-box">
                    <span class="countdown-num" id="cd-hours">--</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-box">
                    <span class="countdown-num" id="cd-mins">--</span>
                    <span class="countdown-label">Mins</span>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-box">
                    <span class="countdown-num" id="cd-secs">--</span>
                    <span class="countdown-label">Secs</span>
                </div>
            </div>

            <!-- 社群連結 -->
            <div class="flex justify-center space-x-8 text-[10px] tracking-widest opacity-40 font-didot">
                <a href="https://www.instagram.com/nchu_ivc?igsh=eXVsemRzOTNyMzc2" target="_blank" class="hover:opacity-80 transition-opacity uppercase">Instagram</a>
                <a href="https://www.facebook.com/share/1Dgu8EkMS1/?mibextid=wwXIfr" target="_blank" class="hover:opacity-80 transition-opacity uppercase">Facebook</a>
            </div>

        </div>
    </section>

    <script>
        const target = new Date('2026-05-11T00:00:00+08:00');

        function update() {
            const now  = new Date();
            const diff = target - now;

            if (diff <= 0) {
                document.getElementById('cd-days').textContent  = '00';
                document.getElementById('cd-hours').textContent = '00';
                document.getElementById('cd-mins').textContent  = '00';
                document.getElementById('cd-secs').textContent  = '00';
                return;
            }

            const days  = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const mins  = Math.floor((diff % 3600000)  / 60000);
            const secs  = Math.floor((diff % 60000)    / 1000);

            document.getElementById('cd-days').textContent  = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent  = String(mins).padStart(2, '0');
            document.getElementById('cd-secs').textContent  = String(secs).padStart(2, '0');
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
